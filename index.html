<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anastasiia & Zak — 13 March 2027</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <header class="site-header">

    <a class="logo" href="#home">
      A <span>&</span> Z
    </a>

    <nav class="navigation">
      <a href="#our-day">Our Day</a>
      <a href="#details">Details</a>
      <a href="#rsvp">RSVP</a>
      <a href="#photos">Photos</a>
    </nav>

  </header>


  <main>

    <section class="hero" id="home">

      <div class="envelope-stage">

        <div class="envelope" id="envelope">


          <!-- BACK OF ENVELOPE -->

          <div class="envelope-back"></div>


          <!-- INVITATION CARD INSIDE -->

          <div class="invitation-card">

            <p class="card-date">
              13 March 2027
            </p>

            <h1>
              Anastasiia
              <span>&</span>
              Zak
            </h1>

            <div class="card-divider">
              ❧ ♡ ❧
            </div>

          </div>


          <!-- FRONT POCKET -->

          <div class="envelope-front"></div>


          <!-- TOP FLAP -->

          <div class="envelope-flap"></div>


          <!-- NAMES ON CLOSED ENVELOPE -->

          <div class="envelope-address">
            <span>Anastasiia</span>
            <b>&</b>
            <span>Zak</span>
          </div>


          <!-- TEXT ON CLOSED ENVELOPE -->

          <div class="envelope-tagline">
            We're getting married!
          </div>


          <!-- WAX SEAL -->

          <button
            class="wax-seal"
            id="openInvitation"
            type="button"
            aria-label="Open invitation"
          >

            <span class="seal-monogram">
              A · Z
            </span>

            <span class="seal-date">
              13 · 03 · 27
            </span>

          </button>


        </div>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
