name: Build approved shawl asset

on:
  push:
    paths:
      - 'assets/shawl-approved-v2.webp.b64'
      - '.github/workflows/build-approved-shawl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild clean approved WebP asset
        run: |
          base64 --decode assets/shawl-approved-v2.webp.b64 > assets/shawl-approved-v2.webp
      - name: Commit generated asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/shawl-approved-v2.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build clean approved shawl asset'
          git push
