name: Build approved shawl asset

on:
  push:
    paths:
      - 'assets/shawl-approved.part*.txt'
      - '.github/workflows/build-approved-shawl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild approved WebP asset
        run: |
          cat assets/shawl-approved.part0.txt \
              assets/shawl-approved.part1.txt \
              assets/shawl-approved.part2.txt \
              assets/shawl-approved.part3.txt \
              assets/shawl-approved.part4.txt \
              assets/shawl-approved.part5.txt \
              assets/shawl-approved.part6.txt | base64 --decode > assets/shawl-approved.webp
      - name: Commit generated asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/shawl-approved.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build approved shawl asset'
          git push
